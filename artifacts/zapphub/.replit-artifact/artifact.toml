kind = "web"
previewPath = "/"
title = "Zapphub"
version = "1.0.0"
id = "artifacts/zapphub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25775

[services.development]
run = "pnpm --filter @workspace/zapphub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zapphub", "run", "build" ]
publicDir = "artifacts/zapphub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25775"
BASE_PATH = "/"
